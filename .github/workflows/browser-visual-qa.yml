name: Browser visual QA
on:
  push:
    branches:
      - integration/single-master-storefront
      - integration/unified-master-2026-11-04
  pull_request:
    branches:
      - codex/complete-store-review
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium browser
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Check Option 2 product-first reference on desktop and Android
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/option-two-qa.mjs
      - name: Run desktop, mobile and commerce browser checks
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/visual-qa.mjs
      - name: Check collection filtering, browsing history and accessible cart
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/shopping-qa.mjs
      - name: Check phone catalogue layout and connected product buttons
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/app-catalogue-qa.mjs
      - name: Check owner purchase preview, ad photo upload and shared launch updates
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/owner-desk-qa.mjs
      - name: Check actual launch gate and automatic opening on website and app
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/launch-gate-qa.mjs
      - name: Check secure payment review, verification and disabled-provider behaviour
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/secure-payments-qa.mjs
      - name: Preserve browser screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-volume-desktop-mobile-qa
          path: reports/visual-qa/
          if-no-files-found: warn
          retention-days: 7
