<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Volume Nutrition — Coming Soon</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: radial-gradient(circle at center, #0f1c3f 0%, #070b19 100%); 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            overflow-x: hidden;
        }
        .countdown-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .logo-container {
            width: 100%;
            max-width: 340px;
            margin: 0 auto 25px auto;
        }
        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            background: transparent;
        }
        .subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            margin-bottom: 25px;
            color: #ffffff;
        }
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        .time-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px 5px;
            border-radius: 8px;
        }
        .time-val {
            font-size: 24px;
            font-weight: 700;
            color: #d4af37;
            display: block;
        }
        .time-lbl {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a99ad;
            margin-top: 4px;
            display: block;
        }
        .footer-note {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8a99ad;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="countdown-card">
        <div class="logo-container">
            <img src="max-volume-logo-wide.png" alt="Max Volume Nutrition">
        </div>
        
        <div class="subtitle">Chennai · Retail · Wholesale & Distribution</div>
        <h1>Something Powerful<br>Is Coming.</h1>
        
        <div class="timer-grid">
            <div class="time-box"><span class="time-val" id="days">00</span><span class="time-lbl">Days</span></div>
            <div class="time-box"><span class="time-val" id="hours">00</span><span class="time-lbl">Hours</span></div>
            <div class="time-box"><span class="time-val" id="minutes">00</span><span class="time-lbl">Mins</span></div>
            <div class="time-box"><span class="time-val" id="seconds">00</span><span class="time-lbl">Secs</span></div>
        </div>
        
        <div class="footer-note">The Full Store Unlocks At 11:00 PM IST</div>
    </div>

    <script>
        const launchDate = new Date("Nov 8, 2026 23:00:00").getTime();

        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(timerInterval);
                window.location.reload();
            }
        }, 1000);
    </script>
</body>
</html>
