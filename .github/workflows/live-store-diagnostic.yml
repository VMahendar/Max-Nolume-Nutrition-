name: Live storefront diagnostic
on:
  push:
    branches:
      - fix/live-catalogue-cart-public-access
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Inspect real Render website and record screenshot
        run: node tests/live-store-diagnostic.mjs
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-store-diagnostic
          path: reports/live-store/
          retention-days: 5
