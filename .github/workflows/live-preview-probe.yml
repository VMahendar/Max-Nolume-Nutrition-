name: MVN Live Preview Link Diagnostic
on:
  push:
    branches:
      - diagnostics/owner-preview-link-check
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public website, mobile app, owner auth and health
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://max-volume-nutrition-preview.onrender.com"
          for entry in "home / 200" "app /mobile-app.html 200" "health /healthz 200" "private /owner-preview?view=desktop 403" "private-app /owner-preview?view=app 403"; do
            read -r label path expected <<< "$entry"
            code=$(curl --silent --show-error --location --retry 3 --retry-delay 3 --retry-all-errors --max-time 45 --output /tmp/mvn-response --write-out "%{http_code}" "$BASE$path")
            printf '%s: HTTP %s (expected %s)\n' "$label" "$code" "$expected"
            if [[ "$code" != "$expected" ]]; then
              echo "Unexpected HTTP response for $label"
              exit 1
            fi
          done
          echo "Reachability and owner access guard look correct from GitHub-hosted runner."
