services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      DATA_DIR: /var/lib/mvn
    expose:
      - "3000"
    volumes:
      - commerce:/var/lib/mvn
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your approved domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  commerce:
  caddy_data:
  caddy_config:
